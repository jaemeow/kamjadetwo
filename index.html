<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>For Her</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Cormorant Garamond', serif;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .film-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 200vw;
    height: 200vh;
    transform: translate(-50%, -50%) rotate(-5deg);
    z-index: 0;
    display: flex;
    justify-content: center;
    gap: 40px;
    overflow: hidden;
    pointer-events: none;
  }

  .film-strip {
    display: flex;
    flex-direction: column;
    animation: scrollFilm 30s linear infinite;
  }

  .film-frame {
    width: 240px;
    height: 360px;
    margin: 15px 0;
    background-color: #111;
    background-size: cover;
    background-position: center;
    border: 10px solid #050505;
    border-left-width: 35px; 
    border-right-width: 35px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .film-frame::before, .film-frame::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 10px;
    background: repeating-linear-gradient(0deg, #333 0px, #333 12px, transparent 12px, transparent 24px);
  }
  .film-frame::before { left: -22px; }
  .film-frame::after { right: -22px; }

  @keyframes scrollFilm {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  .bg-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.75; 
    transition: background-color 1s ease;
    backdrop-filter: blur(4px); 
  }

  .acronym {
    position: fixed;
    top: 40px;
    width: 100%;
    text-align: center;
    z-index: 20;
    letter-spacing: 5px;
    font-size: 26px; 
    font-weight: 600;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    padding: 0 10px;
    text-transform: uppercase;
  }

  .acronym span { 
    opacity: 0.1; 
    transition: 0.5s ease;
    display: inline-block;
    padding: 0 2px;
  }
  
  .acronym span.active { 
    color: #ffb6c1; 
    opacity: 1; 
    text-shadow: 0 0 15px #ffb6c1, 0 0 5px white;
    transform: scale(1.15);
  }

  .container {
    position: relative;
    z-index: 15;
    width: 85%;
    max-width: 400px;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 40px 25px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,1);
  }

  .title {
    font-size: 32px;
    margin-bottom: 20px;
    color: #ffb6c1;
    font-weight: 600;
  }

  .poem {
    font-size: 19px;
    line-height: 1.8;
    white-space: pre-wrap;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .btns {
    margin-top: 30px;
    display: flex;
    justify-content: space-between;
  }

  button {
    padding: 12px 28px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    border-radius: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  button:disabled { opacity: 0.1; }

  #intro {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
  }

  .flower {
    position: fixed;
    top: -50px;
    pointer-events: none;
    z-index: 50;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  @media (max-width: 450px) {
    .acronym { font-size: 18px; letter-spacing: 3px; top: 30px; }
    .container { width: 92%; padding: 30px 20px; }
    .title { font-size: 28px; }
    .poem { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="film-bg">
  <div class="film-strip">
    <div class="film-frame" style="background-image: url('image.jpg');"></div>
    <div class="film-frame" style="background-image: url('img2.jpg');"></div>
    <div class="film-frame" style="background-image: url('img3.jpg');"></div>
    <div class="film-frame" style="background-image: url('img4.jpg');"></div>
    <div class="film-frame" style="background-image: url('img5.jpg');"></div>
    <div class="film-frame" style="background-image: url('image.jpg');"></div>
    <div class="film-frame" style="background-image: url('img2.jpg');"></div>
    <div class="film-frame" style="background-image: url('img3.jpg');"></div>
    <div class="film-frame" style="background-image: url('img4.jpg');"></div>
    <div class="film-frame" style="background-image: url('img5.jpg');"></div>
  </div>
  <div class="film-strip" style="animation-delay: -5s;">
    <div class="film-frame" style="background-image: url('img3.jpg');"></div>
    <div class="film-frame" style="background-image: url('img4.jpg');"></div>
    <div class="film-frame" style="background-image: url('img5.jpg');"></div>
    <div class="film-frame" style="background-image: url('image.jpg');"></div>
    <div class="film-frame" style="background-image: url('img2.jpg');"></div>
    <div class="film-frame" style="background-image: url('img3.jpg');"></div>
    <div class="film-frame" style="background-image: url('img4.jpg');"></div>
    <div class="film-frame" style="background-image: url('img5.jpg');"></div>
    <div class="film-frame" style="background-image: url('image.jpg');"></div>
    <div class="film-frame" style="background-image: url('img2.jpg');"></div>
  </div>
</div>

<div class="bg-overlay" id="bgOverlay"></div>

<div id="intro" onclick="startApp()">
  <p style="font-size: 20px; line-height: 1.6;">hello baby, happy monthsary and happy 20th birthday. <br>for your 20th birthday i prepared 20 corny poems, hope u like em i love u </p>
  <br><span style="opacity:0.5; font-size: 14px;">(tap anywhere to start)</span>
</div>

<div class="acronym" id="acronym">
  <span>I</span><span>L</span><span>O</span><span>V</span><span>E</span><span>Y</span><span>O</span><span>U</span><span>K</span><span>A</span><span>M</span><span>I</span><span>L</span><span>A</span><span>H</span><span>J</span><span>A</span><span>D</span><span>E</span><span>♡</span>
</div>

<div class="container" id="main" style="display:none;">
  <div class="title" id="title"></div>
  <div class="poem" id="poem"></div>
  <div class="btns">
    <button id="prevBtn" onclick="prevPoem()">Prev</button>
    <button id="nextBtn" onclick="nextPoem()">Next</button>
  </div>
</div>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="flowers"></div>

<script>
const poems = [
  {title:"It Suits", theme:"#1a1a1a", text:"You dye your hair like you’re trying something new,\nbut every shade just ends up looking like you.\nRed, black, or something in between\nit’s never the color, it’s how you’re seen."},
  {title:"Like Night", theme:"#111", text:"You wear dark like it belongs to your name,\nlike quiet chaos and comfort are the same.\nwhatever fits you choose,\nyou don’t follow the style, it follows you."},
  {title:"Only You", theme:"#2b2b2b", text:"It’s not the outfit, it’s never been that,\nyou could wear anything simple, mismatched.\nAnd still I’d look a little too long,\nlike something about you just pulls me along."},
  {title:"Very Warm", theme:"#3a2b2b", text:"You don’t fix everything, you don’t pretend,\nbut somehow you make it easier to mend.\nA bad day fades when you’re around,\nlike heavy thoughts just lose their sound."},
  {title:"Everyday Need", theme:"#1b1b1b", text:"A day without you still goes through,\nbut something feels off like it’s missing you.\nLike a sentence that stops before it’s done,\nlike a quiet night without the sun."},
  {title:"You Clear", theme:"#101820", text:"I get lost in thoughts I can’t explain,\nlooping doubts inside my brain.\nThen you talk, and it all slows down,\nlike silence finally found its sound."},
  {title:"Over Again", theme:"#1a1a2e", text:"We fight, we drift, we lose our tone,\nyou go quiet, I overthink alone.\nBut somehow we don’t let it end,\nwe come back, we try again."},
  {title:"Until Stay", theme:"#2e1a1a", text:"You don’t have to try so much,\nyou don’t need some perfect touch.\nJust stay close, just be here,\nthat alone makes everything clear."},
  {title:"Kind Heart", theme:"#1a2e1a", text:"You say you’re not kind, but I disagree,\nI see it in things you don’t let me see.\nIn how you stay, in how you care,\nin quiet ways you’re always there."},
  {title:"Always You", theme:"#2b2b2b", text:"No matter how my whole day goes,\nno matter the highs or even the lows,\nI end up here, thinking of you,\nlike that’s just what my mind will do."},
  {title:"My Favorite", theme:"#3b2f2f", text:"Your lips, I notice them more than I should,\nsoft pink, quiet, sometimes misunderstood.\nNot loud, not trying to demand attention,\nbut somehow they stay in every mention."},
  {title:"I’d Wait", theme:"#2a2a2a", text:"If I kiss you, I’d take it slow,\nlike something I don’t want to let go.\nI’d pause first, just to be sure,\nthat this moment is real and pure."},
  {title:"Love Fully", theme:"#1f1f1f", text:"You point out things you wish were gone,\nlike they’ve been there all along.\nBut when I look, I don’t see flaws,\njust little things I quietly pause."},
  {title:"All Enough", theme:"#2c2c2c", text:"You’re not perfect, you get distant, you fall,\nyou have your moments, you feel it all.\nBut I don’t want perfect, not even close,\nI want the version of you I know the most."},
  {title:"Hold On", theme:"#1a1a1a", text:"We mess up, we lose our way,\nwe dont always know what to say.\nBut at the end of every fight,\nI still choose you every night."},
  {title:"Just Stayed", theme:"#2a1f1f", text:"Some people leave when things get rough,\nwhen love gets quiet, when it’s not enough.\nBut you stayed through the hard parts too,\nand that’s something I hold onto."},
  {title:"Affect Me", theme:"#1a2a2a", text:"One message from you can shift my day,\nturn everything the other way.\nA simple word, a small reply,\nand suddenly I’m feeling high."},
  {title:"Didn’t Plan", theme:"#2a2a3a", text:"I didn’t plan to feel this way,\ndidn’t expect you’d come and stay.\nBut now you’re here, and now it’s true,\nmy world feels different because of you."},
  {title:"Every Time", theme:"#1a1a1a", text:"If this is love, then I understand,\nit’s not just words, it’s where you stand.\nIt’s choosing someone, day by day,\neven when things don’t go your way."},
  {title:"My Love", theme:"#3a1a2a", text:"And at the end, when everything’s said,\nwhen every thought is in my head,\nit always leads me back to you,\nto everything you say and do."}
];

let index = 0;
const audio = document.getElementById("bgm");

function updatePoem() {
  const p = poems[index];
  document.getElementById("title").innerText = p.title;
  document.getElementById("poem").innerText = p.text;
  document.getElementById("bgOverlay").style.backgroundColor = p.theme;
  
  const spans = document.querySelectorAll(".acronym span");
  const progress = Math.floor((index / (poems.length - 1)) * spans.length);
  spans.forEach((s, i) => s.classList.toggle("active", i <= progress));

  document.getElementById("prevBtn").disabled = (index === 0);
  document.getElementById("nextBtn").disabled = (index === poems.length - 1);
}

function nextPoem() { if (index < poems.length - 1) { index++; updatePoem(); } }
function prevPoem() { if (index > 0) { index--; updatePoem(); } }

function startApp() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("main").style.display = "block";
  updatePoem();
  audio.play();
  
  setInterval(() => {
    const f = document.createElement("div");
    f.className = "flower";
    f.innerText = ["🌸","🌷","✨","💖","🩷"][Math.floor(Math.random()*5)];
    f.style.left = Math.random() * 100 + "vw";
    f.style.animationDuration = (Math.random() * 3 + 5) + "s";
    document.getElementById("flowers").appendChild(f);
    setTimeout(() => f.remove(), 8000);
  }, 500);
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { audio.pause(); } 
  else if (document.getElementById("main").style.display === "block") { audio.play(); }
});
</script>
</body>
</html>
